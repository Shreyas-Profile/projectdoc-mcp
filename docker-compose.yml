services:
  web:
    build: .
    container_name: projectdoc-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3013:3013"
    environment:
      - NODE_ENV=production
      - PORT=3013
      - HOSTNAME=0.0.0.0
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - PROJECTDOC_MODEL=${PROJECTDOC_MODEL:-openai/gpt-5-mini}
      - PROJECTDOC_TOKEN=${PROJECTDOC_TOKEN:-}
    networks:
      - default

networks:
  default:
    name: paperloft-assist_default
    external: true
